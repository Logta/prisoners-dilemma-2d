name: Auto Approve
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
permissions: {}

jobs:
  approve:
    if: |
      github.event.pull_request.user.login == github.repository_owner && ! github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: hmarr/auto-approve-action@05a696a09d381a5a0d142c755f7eacbb19eb6525 # v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
